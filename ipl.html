<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Points Tables (2008 - 2026)</title>
    <style>
        /* Modern Dark Web Archetype */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Deep Slate Background */
            color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
            text-align: center;
        }

        /* The Main Block (Container) */
        .main-container {
            width: 100%;
            max-width: 1000px;
            background-color: #1e293b; /* Card Color */
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            
            /* CSS Grid to arrange the 19 year blocks */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        /* The Year Blocks (Links) */
        .year-block {
            background-color: #0f172a;
            color: #38bdf8; /* Accent Blue */
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: block; /* Ensures the whole block is clickable */
        }

        /* Hover effect when the mouse goes over a year */
        .year-block:hover {
            background-color: #38bdf8;
            color: #0f172a;
            transform: translateY(-5px); /* Lift up effect */
            box-shadow: 0 8px 15px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <h1>IPL History Hub</h1>
    <p class="subtitle">Select a year to view the official points table (2008 - 2026)</p>

    <!-- MAIN BLOCK CONTAINER -->
    <div class="main-container">
        
        <!-- 19 YEAR BLOCKS -->
        <a href="2008.html" class="year-block">2008</a>
        <a href="2009.html" class="year-block">2009</a>
        <a href="2010.html" class="year-block">2010</a>
        <a href="2011.html" class="year-block">2011</a>
        <a href="2012.html" class="year-block">2012</a>
        <a href="2013.html" class="year-block">2013</a>
        <a href="2014.html" class="year-block">2014</a>
        <a href="2015.html" class="year-block">2015</a>
        <a href="2016.html" class="year-block">2016</a> 
        <a href="2017.html" class="year-block">2017</a>
        <a href="2018.html" class="year-block">2018</a>
        <a href="2019.html" class="year-block">2019</a>
        <a href="2020.html" class="year-block">2020</a>
        <a href="2021.html" class="year-block">2021</a>
        <a href="2022.html" class="year-block">2022</a>
        <a href="2023.html" class="year-block">2023</a>
        <a href="2024.html" class="year-block">2024</a>
        <a href="2025.html" class="year-block">2025</a>
        <a href="2026.html" class="year-block">2026</a>

    </div>

</body>
</html>
